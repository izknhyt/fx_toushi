[tool.poetry]
name = "fx-toushi"
version = "0.1.0"
description = ""
authors = ["Codex <codex@openai.com>"]
readme = "README.md"
packages = [{ include = "*", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
typer = "==0.20.0"
rich = "==14.2.0"
pydantic = "==2.12.3"
pandas = "==2.3.3"
numpy = "==2.2.6"
pyarrow = "==22.0.0"
pandas-ta = {version = "==0.4.67b0", python = ">=3.12"}
yfinance = "==0.2.54"
orjson = "==3.11.4"
python-json-logger = "==4.0.0"
jsonschema = "==4.25.1"
pyyaml = "==6.0.3"
referencing = "0.35.1"
cryptography = "==43.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "==8.4.2"
pytest-mock = "==3.15.1"
pytest-approvaltests = "==0.2.4"
hypothesis = "==6.142.4"
black = "==23.12.1"
ruff = "==0.14.2"
mypy = "==1.18.2"

[tool.poetry.scripts]
tradectl = "src.interfaces.cli.main:main"
schema-validate = "src.interfaces.cli.schema_validate:main"
check-ops-readiness = "tools.check_ops_readiness:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "T20"]
ignore = ["E203", "ANN101", "ANN102"]
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "data",
    "features",
    "interfaces",
    "persistence",
    "reporter",
    "risk",
    "strategies",
    "ticket",
]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
