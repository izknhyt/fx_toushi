[tool.poetry]
name = "fx-toushi"
version = "0.1.0"
description = ""
authors = ["Codex <codex@openai.com>"]
readme = "README.md"
packages = [{ include = "brokers", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.20.0"
rich = "^14.2.0"
pydantic = "^2.12.3"
pandas = "^2.3.3"
jsonschema = "^4.25.1"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^23.12.0"
ruff = "^0.14.2"
mypy = "^1.18.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "T20"]
ignore = ["E203", "ANN101", "ANN102"]
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "data",
    "features",
    "interfaces",
    "persistence",
    "reporter",
    "risk",
    "strategies",
    "ticket",
]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
