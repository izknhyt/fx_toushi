[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradectl-game"
version = "0.1.0"
description = "MVP simulation game for the FX HITL operations team."
authors = [{name = "FX HITL Tools Team"}]
readme = "mvp_spec_v_1.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["game", "simulation", "fx", "operations"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
tradectl-game = "tradectl_game.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
