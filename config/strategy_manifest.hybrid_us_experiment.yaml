# config/strategy_manifest.hybrid_us_experiment.yaml
# Research-only manifest for Donchian + US session hybrid allocation evaluation.

schema_version: 0
manifest_name: "Hybrid US Experiment (Donchian + US Pullback)"
revision_tag: "HYBRID-US-EXP-2026Q1"
last_reviewed_at: "2026-02-08T00:00:00Z"
notes: |
  研究用manifest。Donchian upper-only（非US時間帯）と
  US Session Trend Pullback（US時間帯）を同時有効化し、
  allocation設定で候補選別を行う。

strategies:
  m1_baseline_donchian_upper_only:
    enabled: true
    priority: 55
    weight: 0.50
    determinism_key: "donchian_v1_upper_only"
    metadata:
      name: "M1 Baseline Donchian (Upper Only)"
      version: "0.1.0"
      required_features:
        - donchian_upper20_1h
        - donchian_lower20_1h
        - donchian_mid20_1h
        - donchian_upper20_1d
        - donchian_lower20_1d
        - donchian_mid20_1d
        - atr_14_1h
        - close_5m
        - regime_trend_1h
        - session_tag_5m
    watchlist:
      - USDJPY
      - EURUSD
      - GBPUSD
      - EURJPY
      - AUDUSD
    lifecycle:
      status: active
      last_validated_at: "2026-02-08T00:00:00Z"
      deprecated_after_days: 365
      runbook_ref: "docs/runbooks/GOV-STRAT-01.md#hybrid_us_experiment"
    feature_flags:
      determinism_enforced: true
      guarded_board_required: false
    datasets:
      - id: "reports/data_manifest.json::m1_baseline_donchian"
        version: "2024Q1"
        validation_playbook_id: "AC-01"
    governance:
      ticket_id: "TICKET-HYBRID-US-EXP"
      last_board_decision: "2026-02-08T00:00:00Z"
      reviewers:
        - Quant Lead
        - Ops Manager
    parameters:
      entry:
        timeframe: 1h
        fallback_timeframe: 1d
        channel_window: 20
        buffer:
          atr_multiplier: 0.02
          min_abs: 0.05
        cooldown_bars: 3
        filters:
          session_utc_range: "06-14"
          trend_required: true
          trend_threshold: 0.0
          atr_min: 0.08
          min_breakout_abs: 0.05
          breakout_min_atr_mult: 0.30
          breakout_min_cost_mult: 3.0
      sizing:
        per_trade_risk_pct: 0.60
        tp_r_multiple: 2.0
        ttl_bars: 12
        max_concurrent_positions:
          overall: 2
          per_currency_bucket: 1
      execution:
        spread: 0.005
        slippage: 0.0015
        slippage_std: 0.001

  m1_us_session_trend_pullback:
    enabled: true
    priority: 56
    weight: 0.50
    determinism_key: "us_session_trend_pullback_v1"
    metadata:
      name: "M1 US Session Trend Pullback"
      version: "0.1.0"
      required_features:
        - ema_fast_5m
        - ema_slow_5m
        - rsi_14_5m
        - atr_14_1h
        - ema55_slope_1h
        - close_5m
        - session_tag_5m
        - regime_trend_1h
    watchlist:
      - USDJPY
      - EURUSD
      - GBPUSD
      - EURJPY
      - AUDUSD
    lifecycle:
      status: active
      last_validated_at: "2026-02-08T00:00:00Z"
      deprecated_after_days: 365
      runbook_ref: "docs/runbooks/GOV-STRAT-01.md#hybrid_us_experiment"
    feature_flags:
      determinism_enforced: true
      guarded_board_required: false
    datasets:
      - id: "reports/data_manifest.json::m1_baseline_ma_rsi"
        version: "2024Q1"
        validation_playbook_id: "AC-01"
    governance:
      ticket_id: "TICKET-HYBRID-US-EXP"
      last_board_decision: "2026-02-08T00:00:00Z"
      reviewers:
        - Quant Lead
        - Ops Manager
    parameters:
      entry:
        timeframe: 5m
        session_utc_range: "16-23"
        trend_threshold: 0.0
        slope_min: 0.02
        rsi_long_min: 48
        rsi_long_max: 64
        rsi_short_min: 36
        rsi_short_max: 52
        cooldown_bars: 3
        filters:
          atr_min: 0.08
          spread_max: 0.007
      sizing:
        per_trade_risk_pct: 0.60
        atr_sl_mult: 1.0
        tp_r_multiple: 1.8
        ttl_bars: 10
        max_concurrent_positions:
          overall: 2
          per_currency_bucket: 1
      execution:
        spread: 0.005
        slippage: 0.0015
        slippage_std: 0.001
