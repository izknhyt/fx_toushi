# config/feature_pipeline.yaml -- CONFIG-SCAFF-01 scaffold
# 詳細設計 §3.4〜§3.5 (Feature Pipeline/Signal Engine) と Runbook STRAT-M1-VALIDATION を参照。
# Schema: docs/schemas/feature_pipeline.schema.json （schema_version 更新時に要同期）。

schema_version: 0  # TODO: FeaturePipeline モデル整備後に更新
pipeline:
  default_timeframe_minutes: 5
  lookback_bars: 512
  resample:
    enabled: true
    timeframes:
      - 5m
      - 1h
      - 1d
indicators:
  sma_20:
    enabled: false
    window: 20
    timeframes:
      - 5m
    output_key: sma_20
  ema_fast:
    enabled: true
    window: 21
    timeframes:
      - 5m
    output_key: ema_fast
  ema_slow:
    enabled: true
    window: 55
    timeframes:
      - 5m
    output_key: ema_slow
  rsi_14:
    enabled: true
    window: 14
    timeframes:
      - 5m
    output_key: rsi_14
  bollinger_20_2:
    enabled: false
    window: 20
    stddev: 2.0
    timeframes:
      - 5m
    output_keys:
      upper: bb_upper
      middle: bb_middle
      lower: bb_lower
  atr_14:
    enabled: true
    window: 14
    timeframes:
      - 1h
    output_key: atr_14
  ema55_slope:
    enabled: true
    window: 55
    derivative: first
    timeframes:
      - 1h
    output_key: ema55_slope
  macd_12_26_9:
    enabled: false  # Guardedモード時は OFF を推奨（§3.5.2）
    fast_period: 12
    slow_period: 26
    signal_period: 9
    timeframes:
      - 1h
    output_keys:
      line: macd_line
      signal: macd_signal
      histogram: macd_hist
  donchian_20:
    enabled: true
    window: 20
    timeframes:
      - 1h
      - 1d
    output_keys:
      upper: donchian_upper20
      lower: donchian_lower20
      mid: donchian_mid20
  zscore_20:
    enabled: false
    window: 20
    timeframes:
      - 1d
    output_key: zscore_20
  session_tag:
    enabled: true
    timeframes:
      - 5m
    output_key: session_tag
  regime_trend:
    enabled: true
    timeframes:
      - 1h
    output_key: regime_trend
feature_flags:
  enable_pipeline_latency_metrics: true
  use_experimental_features: false
