[pytest]
minversion = 7.0
addopts = -ra
testpaths = tests
markers =
    smoke: Quick validation suite that exercises schema compatibility and config baselines.
    config_schema_smoke: Tests that ensure configuration samples conform to their JSON Schemas.
    strategy_determinism: Tests that verify strategy execution paths remain deterministic across runs.
    data_status_cli: Tests that validate tradectl data status stage evaluation logging.
    strategy_plugin_contract: Tests that enforce Strategy Plugin Protocol signatures and metadata contracts.
    feature_context_contract: Tests that ensure FeatureContext and manifest required_features stay aligned.
    strategy_manifest: Tests that verify strategy_manifest.yaml governance invariants.
    strategy_registry: Tests that assert StrategyRegistry fail-fast and deterministic hash behavior.
    ticket_builder: Tests that check TicketBuilder checklist/GateState integration.
    json_schema_validation: Tests that validate docs/schemas JSON Schema assets remain consistent.
    reduce_only_config: Human Gate / Reduce-Only configuration validation tests.
    sla_threshold_config: Tests that validate SLA threshold profile scaffolds.
