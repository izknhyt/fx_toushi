name: regression-backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  regression-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run regression backtest
        env:
          REGRESSION_MAX_RUNTIME_MIN: "30"
        run: |
          make regression-backtest
      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-backtest
          path: reports/regression/backtest/
