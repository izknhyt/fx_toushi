name: broker-certification

on:
  workflow_dispatch:

jobs:
  broker-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run broker certification smoke
        env:
          BROKER_PRINCIPAL_ID: ${{ secrets.BROKER_PRINCIPAL_ID }}
          BROKER_DEVICE_ID: ${{ secrets.BROKER_DEVICE_ID }}
        run: |
          make broker-certification-smoke ARGS="--principal-id ${BROKER_PRINCIPAL_ID} --device-id ${BROKER_DEVICE_ID}"
      - name: Upload broker certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-certification
          path: reports/validation_log/
