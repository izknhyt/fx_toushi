# Template: Python smoke test workflow for FX Toushi
# Runs the lightweight schema/config validation suite referenced in detailed_design §0.6.9.
parameters:
  pythonVersion: '3.12'
  displayName: 'python-smoke'

jobs:
  - job: python_smoke
    displayName: ${{ parameters.displayName }}
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UsePythonVersion@0
        displayName: 'Use Python ${{ parameters.pythonVersion }}'
        inputs:
          versionSpec: ${{ parameters.pythonVersion }}

      - script: |
          python -m pip install --upgrade pip
          python -m pip install poetry
        displayName: 'Install Poetry'

      - script: |
          poetry config virtualenvs.create false --local
          poetry install --no-root
        displayName: 'Install project dependencies'

      - script: |
          mkdir -p artifacts/python-smoke
          poetry run pytest -k smoke --maxfail=1 --disable-warnings -vv \
            | tee artifacts/python-smoke/pytest.log
        displayName: 'Run smoke test suite'
      - script: |
          mkdir -p artifacts/python-smoke/performance-snapshot-contract
          poetry run pytest tests/contracts/test_performance_snapshot_schema.py -vv --maxfail=1 \
            | tee artifacts/python-smoke/performance-snapshot-contract/pytest.log
        displayName: 'Validate performance snapshot schema'

      - script: |
          git fetch --force origin main
          make check-doc-sync ARGS="--compare-ref origin/main"
        displayName: 'Verify doc/runbook coverage'

      - script: |
          make verify-config-evidence ARGS="--grace-days 2"
        displayName: 'Verify CONFIG-SCAFF-01 evidence bundle'

      - script: |
          CFG_HASH=$(python - <<'PY'
import hashlib, pathlib
path = pathlib.Path("config/ops.yaml")
data = path.read_bytes()
h = hashlib.sha256()
h.update(data)
print("sha256:" + h.hexdigest())
PY
)
          DATA_HASH=$(python - <<'PY'
import json, pathlib
manifest_path = pathlib.Path("reports/data_manifest.json")
manifest = json.loads(manifest_path.read_text())
print(manifest.get("strategies", {}).get("m1_baseline_ma_rsi", {}).get("dataset_sha256", ""))
PY
)
          mkdir -p snapshots/latest
          PYTHONPATH=.:src python3 tools/persist_gate_state.py \
            --path snapshots/latest/gate_state.json \
            --cfg-hash "$CFG_HASH" \
            --data-hash "$DATA_HASH"
        displayName: 'Persist gate_state with cfg/data hashes'

      - script: |
          make report-weekly
        displayName: 'Generate weekly ticket summary (smoke)'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish smoke logs'
        condition: succeededOrFailed()
        inputs:
          targetPath: artifacts/python-smoke
          artifact: python-smoke-logs
          publishLocation: pipeline
