name: broker-api-monitor

on:
  workflow_dispatch:

jobs:
  broker-api-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run broker API monitor smoke
        run: |
          make broker-api-monitor-smoke ARGS="--adapter sandbox --window 4h"
      - name: Upload broker API monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-api-monitor
          path: reports/validation_log/
