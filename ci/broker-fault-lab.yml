name: broker-fault-lab

on:
  workflow_dispatch:

jobs:
  broker-fault-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run broker fault lab smoke
        run: |
          make broker-fault-smoke
      - name: Upload broker fault lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-fault-lab
          path: reports/validation_log/
