name: broker-api-smoke

on:
  workflow_dispatch:

jobs:
  broker-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run broker API smoke
        env:
          BROKER_PRINCIPAL_ID: ${{ secrets.BROKER_PRINCIPAL_ID }}
          BROKER_DEVICE_ID: ${{ secrets.BROKER_DEVICE_ID }}
        run: |
          make broker-api-smoke ARGS="--symbol EURUSD --entry-price 1.1000 --principal-id ${BROKER_PRINCIPAL_ID} --device-id ${BROKER_DEVICE_ID}"
      - name: Upload broker API smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-api-smoke
          path: reports/validation_log/
