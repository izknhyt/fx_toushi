schema_version: compliance.pretrade.v1
max_leverage: 30
fifo_required: true
hedge_allowed: false
position_limits:
  total_open_positions: 4
  symbol:
    USDJPY:
      max_lots: 2.0
      max_side: both
    EURUSD:
      max_lots: 1.5
      max_side: net_short
blocked_pairs: ["TRYJPY"]
blocked_time_windows:
  - weekday: "fri"
    start: "20:00"
    end: "23:00"
    reason: "rollover"
override_roles: ["OpsManager", "PO"]
runbook_map:
  max_leverage: "RUN-RISK-03#step2"
  fifo_required: "RUN-RISK-03#step5"
  hedge_allowed: "RUN-RISK-03#step6"
  position_limits: "RUN-RISK-03#step7"
  blocked_pairs: "RUN-RISK-03#step8"
  blocked_time_windows: "RUN-RISK-03#step9"
